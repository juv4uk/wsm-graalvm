name: sens-conformance-adapter

on:
  pull_request:
    paths:
      - 'scripts/check-sens-execution-conformance.py'
      - 'scripts/test-sens-execution-conformance.sh'
      - '.github/workflows/sens-conformance-adapter.yml'
  push:
    branches: [ main ]
    paths:
      - 'scripts/check-sens-execution-conformance.py'
      - 'scripts/test-sens-execution-conformance.sh'
      - '.github/workflows/sens-conformance-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-oracle-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SENS_READ_TOKEN || github.token }}

      - name: Verify exact pinned authority
        run: |
          PIN=$(git ls-files -s external/sens | awk '$1 == "160000" {print $2}')
          HEAD=$(git -C external/sens rev-parse HEAD)
          test -n "$PIN"
          test "$PIN" = "$HEAD"
          echo "SENS pin=$PIN"

      - name: Consume real and bounded Contract 11.6 oracle rows
        run: bash scripts/test-sens-execution-conformance.sh
