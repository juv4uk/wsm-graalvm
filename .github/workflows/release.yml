name: release-build

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build.sh"
      - "scripts/build-native.sh"
      - "scripts/stage-release-payload.sh"
      - "scripts/write-release-metadata.sh"
      - "scripts/write-release-sbom.py"
      - "scripts/package-deb.sh"
      - "scripts/package-rpm.sh"
      - "scripts/package-msi.ps1"
      - "scripts/test-linux-packages.sh"
      - "scripts/test-msi-lifecycle.ps1"
      - "refs/**"
      - "src/main/java/**"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer candidate, for example 0.1.0"
        required: true
        default: "0.1.0"
      source_ref:
        description: "Exact branch, tag or commit to build"
        required: true
        default: "main"

concurrency:
  group: release-integrator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRAALVM_VERSION: "25.3.4.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve immutable release inputs
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            push)
              TAG="${GITHUB_REF_NAME}"
              [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "invalid release tag: $TAG" >&2; exit 1; }
              VERSION="${BASH_REMATCH[1]}"
              SOURCE_SHA="$(git rev-parse "$TAG^{commit}")"
              ;;
            pull_request)
              VERSION="0.1.0"
              TAG="v0.1.0"
              SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            workflow_dispatch)
              VERSION="${{ inputs.version }}"
              VERSION="${VERSION#v}"
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid SemVer: $VERSION" >&2; exit 1; }
              TAG="v$VERSION"
              SOURCE_SHA="$(git rev-parse "${{ inputs.source_ref }}^{commit}")"
              ;;
            *) echo "unsupported event" >&2; exit 1 ;;
          esac
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid SemVer: $VERSION" >&2; exit 1; }
          test -n "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "RELEASE INPUTS version=$VERSION tag=$TAG source=$SOURCE_SHA"

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: ${{ env.GRAALVM_VERSION }}
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify authority and toolchain
        shell: bash
        run: |
          bash scripts/verify-authority.sh external/my-lisp
          java --version
          javac --version
          native-image --version
          bash -n scripts/stage-release-payload.sh scripts/write-release-metadata.sh scripts/package-deb.sh scripts/package-rpm.sh scripts/test-linux-packages.sh scripts/test-release-artifact-contract.sh
          python3 -m py_compile scripts/write-release-sbom.py
          bash scripts/test-release-artifact-contract.sh
      - name: Run semantic release gate
        shell: bash
        run: bash scripts/release-gate.sh
      - name: Build native Linux payload
        shell: bash
        env:
          MYLISP: external/my-lisp
        run: |
          bash scripts/build-native.sh
          test -x native-wsm
          rm -rf dist
          bash scripts/stage-release-payload.sh "v${{ needs.validate.outputs.version }}" linux-x86_64 native-wsm dist/linux-x86_64
      - name: Build DEB and RPM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          bash scripts/package-deb.sh "v${{ needs.validate.outputs.version }}" dist/linux-x86_64 dist/deb
          bash scripts/package-rpm.sh "v${{ needs.validate.outputs.version }}" dist/linux-x86_64 dist/rpm
      - name: Test package lifecycle
        shell: bash
        run: |
          bash scripts/test-linux-packages.sh "v${{ needs.validate.outputs.version }}" dist/linux-x86_64 \
            dist/deb/wsm-graalvm-${{ needs.validate.outputs.version }}-linux-x86_64.deb \
            dist/rpm/wsm-graalvm-${{ needs.validate.outputs.version }}-linux-x86_64.rpm
      - name: Package Linux portable archive
        shell: bash
        run: |
          cd dist/linux-x86_64
          tar -czf ../wsm-graalvm-${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz .
      - name: Hash Linux release assets
        shell: bash
        run: |
          cd dist
          sha256sum \
            wsm-graalvm-${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz \
            deb/wsm-graalvm-${{ needs.validate.outputs.version }}-linux-x86_64.deb \
            rpm/wsm-graalvm-${{ needs.validate.outputs.version }}-linux-x86_64.rpm \
            > linux-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/wsm-graalvm-*.tar.gz
            dist/deb/*.deb
            dist/rpm/*.rpm
            dist/linux-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: ${{ env.GRAALVM_VERSION }}
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify authority and toolchain
        shell: bash
        run: |
          bash scripts/verify-authority.sh external/my-lisp
          java --version
          javac --version
          G_POSIX="$(cygpath -u "$GRAALVM_HOME")"
          "$G_POSIX/bin/native-image.cmd" --version
          bash -n scripts/stage-release-payload.sh scripts/write-release-metadata.sh scripts/test-release-artifact-contract.sh
          python -m py_compile scripts/write-release-sbom.py
          bash scripts/test-release-artifact-contract.sh
      - name: Run semantic release gate
        shell: bash
        run: bash scripts/release-gate.sh
      - name: Build native Windows payload
        shell: bash
        env:
          MYLISP: external/my-lisp
        run: |
          bash scripts/build-native.sh
          test -f native-wsm.exe
          rm -rf dist
          bash scripts/stage-release-payload.sh "v${{ needs.validate.outputs.version }}" windows-x86_64 native-wsm.exe dist/windows-x86_64
      - name: Build MSI
        shell: pwsh
        run: |
          ./scripts/package-msi.ps1 "v${{ needs.validate.outputs.version }}" "$env:GITHUB_WORKSPACE\dist\windows-x86_64" "$env:GITHUB_WORKSPACE\dist\msi"
      - name: Test MSI lifecycle
        shell: pwsh
        run: |
          ./scripts/test-msi-lifecycle.ps1 "$env:GITHUB_WORKSPACE\dist\msi\wsm-graalvm-${{ needs.validate.outputs.version }}-windows-x86_64.msi" "$env:GITHUB_WORKSPACE\dist\windows-x86_64"
      - name: Package Windows portable archive
        shell: pwsh
        run: |
          $name = "wsm-graalvm-${{ needs.validate.outputs.version }}-windows-x86_64"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\windows-x86_64\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\$name.zip" -Force
      - name: Hash Windows release assets
        shell: pwsh
        run: |
          $files = @(
            "$env:GITHUB_WORKSPACE\dist\wsm-graalvm-${{ needs.validate.outputs.version }}-windows-x86_64.zip",
            "$env:GITHUB_WORKSPACE\dist\msi\wsm-graalvm-${{ needs.validate.outputs.version }}-windows-x86_64.msi"
          )
          $hashes = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path $f -Leaf) }
          Set-Content -Path "$env:GITHUB_WORKSPACE\dist\windows-SHA256SUMS.txt" -Value $hashes
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/wsm-graalvm-*.zip
            dist/msi/*.msi
            dist/windows-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == "push"
    needs: [validate, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release asset set and checksums
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.validate.outputs.version }}"
          test -f "dist/wsm-graalvm-$V-linux-x86_64.tar.gz"
          test -f "dist/deb/wsm-graalvm-$V-linux-x86_64.deb"
          test -f "dist/rpm/wsm-graalvm-$V-linux-x86_64.rpm"
          test -f "dist/wsm-graalvm-$V-windows-x86_64.zip"
          test -f "dist/msi/wsm-graalvm-$V-windows-x86_64.msi"
          test -s dist/linux-SHA256SUMS.txt
          test -s dist/windows-SHA256SUMS.txt
          grep -F "wsm-graalvm-$V-linux-x86_64.tar.gz" dist/linux-SHA256SUMS.txt
          grep -F "wsm-graalvm-$V-linux-x86_64.deb" dist/linux-SHA256SUMS.txt
          grep -F "wsm-graalvm-$V-linux-x86_64.rpm" dist/linux-SHA256SUMS.txt
          grep -F "wsm-graalvm-$V-windows-x86_64.zip" dist/windows-SHA256SUMS.txt
          grep -F "wsm-graalvm-$V-windows-x86_64.msi" dist/windows-SHA256SUMS.txt
      - name: Verify every checksum byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.validate.outputs.version }}"
          cd dist
          sha256sum "wsm-graalvm-$V-linux-x86_64.tar.gz" | grep -F -f linux-SHA256SUMS.txt
          sha256sum "deb/wsm-graalvm-$V-linux-x86_64.deb" | grep -F -f linux-SHA256SUMS.txt
          sha256sum "rpm/wsm-graalvm-$V-linux-x86_64.rpm" | grep -F -f linux-SHA256SUMS.txt
          sha256sum "wsm-graalvm-$V-windows-x86_64.zip" | grep -F -f windows-SHA256SUMS.txt
          sha256sum "msi/wsm-graalvm-$V-windows-x86_64.msi" | grep -F -f windows-SHA256SUMS.txt
      - name: Publish GitHub Release atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag }}"
          gh release create "$TAG" \
            "dist/wsm-graalvm-$V-linux-x86_64.tar.gz" \
            "dist/deb/wsm-graalvm-$V-linux-x86_64.deb" \
            "dist/rpm/wsm-graalvm-$V-linux-x86_64.rpm" \
            "dist/wsm-graalvm-$V-windows-x86_64.zip" \
            "dist/msi/wsm-graalvm-$V-windows-x86_64.msi" \
            "dist/linux-SHA256SUMS.txt" \
            "dist/windows-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "${{ needs.validate.outputs.source_sha }}" \
            --title "$TAG" \
            --generate-notes
