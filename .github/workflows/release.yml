name: release-build

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build.sh"
      - "scripts/build-native.sh"
      - "scripts/build-release.sh"
      - "release/**"
      - "src/main/java/**"
      - "refs/**"
      - "VERSION"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRAALVM_VERSION: "25.3.4.1"

jobs:
  build:
    name: ${{ matrix.platform }} native release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned Lisp authority
        shell: bash
        run: bash scripts/verify-authority.sh external/my-lisp

      - name: Set up GraalVM CE + Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: "${{ env.GRAALVM_VERSION }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Native Image toolchain
        shell: bash
        run: |
          java --version
          javac --version
          native-image --version

      - name: Build native image and Canon witness
        shell: bash
        env:
          MYLISP: external/my-lisp
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME#v}"

      - name: Smoke-test staged Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf '(quote 42)\n' > "$RUNNER_TEMP/wsm-release-smoke.lisp"
          dist/linux-x64/bin/wsm-graalvm "$RUNNER_TEMP/wsm-release-smoke.lisp" | tee "$RUNNER_TEMP/smoke.log"
          grep -q "42" "$RUNNER_TEMP/smoke.log"

      - name: Package Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" != "${GITHUB_REF_NAME}" ] || VERSION="0.1.0-dev"
          BASE="wsm-graalvm-$VERSION-${{ matrix.platform }}"
          tar -C "dist/${{ matrix.platform }}" -czf "$BASE.tar.gz" .
          sha256sum "$BASE.tar.gz" | awk '{print $1}' > "$BASE.tar.gz.sha256"

      - name: Smoke-test staged Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smoke = Join-Path $env:TEMP "wsm-release-smoke.lisp"
          Set-Content -Path $smoke -Value "(quote 42)"
          & "dist\windows-x64\bin\wsm-graalvm.cmd" $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version -match '^v(.+)$') { $version = $Matches[1] } else { $version = '0.1.0-dev' }
          $base = "wsm-graalvm-$version-${{ matrix.platform }}"
          Compress-Archive -Path "dist\${{ matrix.platform }}\*" -DestinationPath "$base.zip" -Force
          $hash = (Get-FileHash "$base.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path "$base.zip.sha256" -Value $hash

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            wsm-graalvm-*-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do
            archive="${checksum%.sha256}"
            test -f "$archive"
            expected=$(tr -d '\r\n ' < "$checksum")
            actual=$(sha256sum "$archive" | awk '{print $1}')
            test "$expected" = "$actual"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
