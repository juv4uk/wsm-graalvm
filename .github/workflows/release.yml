name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release candidate semantic gate
    uses: ./.github/workflows/m0-gates.yml
    secrets: inherit

  build:
    name: Build ${{ matrix.platform }}
    needs: release-gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must be MAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up GraalVM CE 25.3.4.1
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: "25.3.4.1"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux Native Image
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        env:
          MYLISP: external/my-lisp
        run: |
          G="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          G="$G" bash scripts/build-native.sh

      - name: Build Windows Native Image
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        env:
          MYLISP: external/my-lisp
        run: ./scripts/build-native-windows.ps1

      - name: Package Linux release
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          DIST="wsm-graalvm-${{ inputs.version }}-linux-x86_64"
          rm -rf "$DIST"
          mkdir -p "$DIST/bin" "$DIST/my-lisp"
          cp native-wsm "$DIST/bin/wsm-graalvm"
          cat > "$DIST/bin/wsm-graalvm-run" <<'EOF'
#!/usr/bin/env bash
set -euo pipefail
ROOT="$(cd "$(dirname "$0")/.." && pwd)"
if [ "$#" -lt 1 ]; then echo "usage: wsm-graalvm-run <program.lisp> [registry.lisp] [my-lisp-root]" >&2; exit 2; fi
REGISTRY="${2:-$ROOT/my-lisp/lib/surface/semantic-registry.lisp}"
LISP_ROOT="${3:-$ROOT/my-lisp}"
exec "$ROOT/bin/wsm-graalvm" "$1" "$REGISTRY" "$LISP_ROOT"
EOF
          chmod +x "$DIST/bin/wsm-graalvm" "$DIST/bin/wsm-graalvm-run"
          git -C external/my-lisp archive --format=tar HEAD | tar -xf - -C "$DIST/my-lisp"
          PIN="$(git -C external/my-lisp rev-parse HEAD)"
          printf 'wsm-graalvm %s\nmy-lisp %s\nplatform linux-x86_64\ngraalvm 25.3.4.1\n' "${{ inputs.version }}" "$PIN" > "$DIST/RELEASE.txt"
          cp README.md LICENSE "$DIST/"
          tar -czf "$DIST.tar.gz" "$DIST"

      - name: Package Windows release
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $Dist = "wsm-graalvm-${{ inputs.version }}-windows-x86_64"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $Dist
          New-Item -ItemType Directory -Force "$Dist/bin", "$Dist/my-lisp" | Out-Null
          Copy-Item native-wsm.exe "$Dist/bin/wsm-graalvm.exe"
          @(
            '@echo off',
            'set ROOT=%~dp0..',
            'if "%~1"=="" (echo usage: wsm-graalvm-run ^<program.lisp^> [registry.lisp] [my-lisp-root] & exit /b 2)',
            'set REGISTRY=%~2',
            'if "%REGISTRY%"=="" set REGISTRY=%ROOT%\my-lisp\lib\surface\semantic-registry.lisp',
            'set LISP_ROOT=%~3',
            'if "%LISP_ROOT%"=="" set LISP_ROOT=%ROOT%\my-lisp',
            '"%ROOT%\bin\wsm-graalvm.exe" "%~1" "%REGISTRY%" "%LISP_ROOT%"'
          ) | Set-Content "$Dist/bin/wsm-graalvm-run.cmd"
          git -C external/my-lisp archive --format=tar HEAD | tar -xf - -C "$Dist/my-lisp"
          $Pin = git -C external/my-lisp rev-parse HEAD
          @(
            "wsm-graalvm ${{ inputs.version }}",
            "my-lisp $Pin",
            "platform windows-x86_64",
            "graalvm 25.3.4.1"
          ) | Set-Content "$Dist/RELEASE.txt"
          Copy-Item README.md, LICENSE "$Dist/"
          Compress-Archive -Path "$Dist/*" -DestinationPath "$Dist.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            wsm-graalvm-*.tar.gz
            wsm-graalvm-*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        shell: bash
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify complete release set
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/wsm-graalvm-${{ inputs.version }}-linux-x86_64.tar.gz"
          test -f "release-assets/wsm-graalvm-${{ inputs.version }}-windows-x86_64.zip"

      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --target "${{ github.sha }}" \
            --title "wsm-graalvm v${{ inputs.version }}" \
            --generate-notes \
            release-assets/wsm-graalvm-${{ inputs.version }}-linux-x86_64.tar.gz \
            release-assets/wsm-graalvm-${{ inputs.version }}-windows-x86_64.zip
