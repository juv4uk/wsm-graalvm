name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the leading v, e.g. 0.1.0"
        required: true
        type: string
      source_ref:
        description: "Source ref to release; defaults to the workflow commit"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo "invalid SemVer: $INPUT_VERSION" >&2
            exit 1
          }
          TAG="v$INPUT_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi
          SOURCE_REF="${INPUT_SOURCE_REF:-$GITHUB_SHA}"
          if RESOLVED_SHA=$(git rev-parse --verify "$SOURCE_REF^{commit}" 2>/dev/null); then
            :
          elif RESOLVED_SHA=$(git rev-parse --verify "origin/$SOURCE_REF^{commit}" 2>/dev/null); then
            :
          else
            echo "source ref does not resolve to a commit: $SOURCE_REF" >&2
            exit 1
          fi
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_ref=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

  semantic-gate:
    name: Release semantic/bootstrap gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          submodules: recursive
          fetch-depth: 0
      - name: Set up GraalVM CE 25.3.4.1
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: "25.3.4.1"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test deterministic release packaging
        run: bash scripts/test-package-release.sh
      - name: Run release gate
        env:
          MYLISP: external/my-lisp
        run: bash scripts/release-gate.sh
      - name: Upload release gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            release-my-lisp-pin.txt
            native-canon.log
          if-no-files-found: error

  build:
    name: Native ${{ matrix.platform }}
    needs: [validate, semantic-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            shell: bash
            binary: native-wsm
          - platform: windows-x86_64
            runner: windows-latest
            shell: bash
            binary: native-wsm.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          submodules: recursive
          fetch-depth: 0
      - name: Set up GraalVM CE 25.3.4.1
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: "25.3.4.1"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image
        shell: ${{ matrix.shell }}
        env:
          MYLISP: external/my-lisp
        run: |
          bash scripts/build-native.sh
          test -f "${{ matrix.binary }}" || {
            echo "missing native binary: ${{ matrix.binary }}" >&2
            exit 1
          }
      - name: Verify package authority pin
        shell: ${{ matrix.shell }}
        run: |
          PIN="$(git -C external/my-lisp rev-parse HEAD)"
          MANIFEST_PIN="$(sed -n 's/^[[:space:]]*(pin \. "\([0-9a-f]\{40\}\)").*/\1/p' refs/lisp-dependency-manifest.lisp)"
          test "$PIN" = "$MANIFEST_PIN"
      - name: Package release
        shell: ${{ matrix.shell }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          REPO_SHA: ${{ needs.validate.outputs.source_ref }}
        run: |
          MYLISP_PIN="$(git -C external/my-lisp rev-parse HEAD)"
          python scripts/package-release.py             --version "$VERSION"             --platform "$PLATFORM"             --binary "$BINARY"             --upstream external/my-lisp             --upstream-pin "$MYLISP_PIN"             --repo-sha "$REPO_SHA"             --out dist
      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/wsm-graalvm-*.zip
            dist/wsm-graalvm-*.zip.sha256
            dist/wsm-graalvm-*.binary.sha256
            dist/assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify both platform packages are present
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/assets/wsm-graalvm-${VERSION}-linux-x86_64"
          test -f "dist/wsm-graalvm-${VERSION}-linux-x86_64.zip"
          test -f "dist/assets/wsm-graalvm-${VERSION}-windows-x86_64.exe"
          test -f "dist/wsm-graalvm-${VERSION}-windows-x86_64.zip"
          ls -la dist dist/assets
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag appeared during release; refusing partial publish" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
# wsm-graalvm $TAG

Source commit: $SOURCE_REF

Both Linux x86_64 and Windows x86_64 Native Image packages passed the semantic release gate and platform builds.

Each package contains the exact pinned my-lisp authority inputs, README, LICENSE, runner scripts, release/source metadata, and SHA256 checksums.
EOF
          ASSETS=(
            "dist/assets/wsm-graalvm-${VERSION}-linux-x86_64"
            "dist/wsm-graalvm-${VERSION}-linux-x86_64.zip"
            "dist/wsm-graalvm-${VERSION}-linux-x86_64.zip.sha256"
            "dist/wsm-graalvm-${VERSION}-linux-x86_64.binary.sha256"
            "dist/assets/wsm-graalvm-${VERSION}-windows-x86_64.exe"
            "dist/wsm-graalvm-${VERSION}-windows-x86_64.zip"
            "dist/wsm-graalvm-${VERSION}-windows-x86_64.zip.sha256"
            "dist/wsm-graalvm-${VERSION}-windows-x86_64.binary.sha256"
          )
          gh release create "$TAG" --target "$SOURCE_REF" --title "wsm-graalvm $TAG" --notes-file release-notes.md "${ASSETS[@]}"
