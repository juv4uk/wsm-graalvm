name: release-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without leading v, for example 0.1.0"
        required: true
        type: string
      source_ref:
        description: "Commit, branch, or tag to release; defaults to current commit"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - id: meta
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          SOURCE_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid SemVer: $VERSION_INPUT" >&2
            exit 1
          }
          TAG="v$VERSION_INPUT"
          git fetch origin --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi
          SOURCE_REF="$SOURCE_INPUT"
          if [ -z "$SOURCE_REF" ]; then SOURCE_REF="$GITHUB_SHA"; fi
          SOURCE_SHA=$(git rev-parse --verify "$SOURCE_REF^{commit}" 2>/dev/null || true)
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA=$(git rev-parse --verify "origin/$SOURCE_REF^{commit}" 2>/dev/null || true)
          fi
          [ -n "$SOURCE_SHA" ] || { echo "source ref does not resolve: $SOURCE_REF" >&2; exit 1; }
          echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  semantic-gate:
    name: Semantic and bootstrap gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Set up GraalVM CE 25.3.4.1
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: "25.3.4.1"
          github-token: ${{ github.token }}
      - name: Release package smoke test
        run: bash scripts/test-package-release.sh
      - name: Run release gate
        env:
          MYLISP: external/my-lisp
        run: bash scripts/release-gate.sh

  native:
    name: Native ${{ matrix.platform }}
    needs: [validate, semantic-gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            shell: bash
            binary: native-wsm
          - platform: windows-x86_64
            runner: windows-latest
            shell: bash
            binary: native-wsm.exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Set up GraalVM CE 25.3.4.1
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: "25.3.4.1"
          github-token: ${{ github.token }}
      - name: Build Native Image
        shell: ${{ matrix.shell }}
        env:
          MYLISP: external/my-lisp
        run: |
          bash scripts/build-native.sh
          test -f "${{ matrix.binary }}"
      - name: Verify exact authority pin
        shell: ${{ matrix.shell }}
        run: |
          PIN=$(git -C external/my-lisp rev-parse HEAD)
          MANIFEST_PIN=$(sed -n 's/^[[:space:]]*(pin \. "\([0-9a-f]\{40\}\)").*/\1/p' refs/lisp-dependency-manifest.lisp)
          test "$PIN" = "$MANIFEST_PIN"
      - name: Package release
        shell: ${{ matrix.shell }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          MYLISP_PIN=$(git -C external/my-lisp rev-parse HEAD)
          GITLINK_PIN=$(git ls-tree HEAD external/my-lisp | awk '{print $3}')
          test "$MYLISP_PIN" = "$GITLINK_PIN"
          python scripts/package-release.py --version "$VERSION" --platform "$PLATFORM" --binary "$BINARY" --upstream external/my-lisp --upstream-pin "$MYLISP_PIN" --repo-sha "$SOURCE_SHA" --out dist
      - name: Build Linux Debian and RPM packages
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
          PAYLOAD="dist/wsm-graalvm-$VERSION-linux-x86_64"
          bash scripts/package-deb.sh "$VERSION" "$PAYLOAD" dist/deb
          bash scripts/package-rpm.sh "$VERSION" "$PAYLOAD" dist/rpm
      - name: Build Windows installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 7\ISCC.exe" -ErrorAction Stop | Select-Object -First 1
          $payload = (Resolve-Path "dist\wsm-graalvm-$env:VERSION-windows-x86_64").Path
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          & $iscc.FullName "/DSourceDir=$payload" "/DOutputDir=$(Resolve-Path dist\installer)" "/DVersion=$env:VERSION" "installer\windows\wsm-graalvm.iss"
          Get-ChildItem dist\installer
      - name: Smoke-test Linux packages
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' '(canon-conforms?)' > dist/package-smoke.lisp
          sudo dpkg -i "dist/deb/wsm-graalvm-$VERSION-linux-x86_64.deb"
          sudo /usr/bin/wsm dist/package-smoke.lisp > dist/deb-smoke.log 2>&1
          grep -q "canon-conformance satisfied" dist/deb-smoke.log
          grep -q "$VERSION" "/usr/lib/wsm-graalvm/$VERSION/RELEASE.txt"
          sudo dpkg -r wsm-graalvm
          test ! -e "/usr/lib/wsm-graalvm/$VERSION"
          sudo rpm -i "dist/rpm/wsm-graalvm-$VERSION-linux-x86_64.rpm"
          sudo /usr/bin/wsm dist/package-smoke.lisp > dist/rpm-smoke.log 2>&1
          grep -q "canon-conformance satisfied" dist/rpm-smoke.log
          grep -q "$VERSION" "/usr/lib/wsm-graalvm/$VERSION/RELEASE.txt"
          sudo rpm -e wsm-graalvm
          test ! -e "/usr/lib/wsm-graalvm/$VERSION"

      - name: Smoke-test Windows installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Resolve-Path "dist\installer\wsm-graalvm-$env:VERSION-windows-x86_64-installer.exe"
          $program = Join-Path $env:RUNNER_TEMP "package-smoke.lisp"
          Set-Content -Path $program -Value "(canon-conforms?)" -Encoding utf8
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -NoNewWindow
          $installDir = Join-Path $env:ProgramFiles "WSM\$env:VERSION"
          Test-Path (Join-Path $installDir "wsm.cmd")
          Select-String -Path (Join-Path $installDir "RELEASE.txt") -Pattern $env:VERSION
          & (Join-Path $installDir "run.cmd") $program 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "windows-smoke.log")
          Select-String -Path (Join-Path $env:RUNNER_TEMP "windows-smoke.log") -Pattern "canon-conformance satisfied"
          Start-Process -FilePath (Join-Path $installDir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -NoNewWindow
          if (Test-Path $installDir) { throw "installer uninstall left files behind" }

      - name: Hash every distributable artifact
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) -print0 |
            while IFS= read -r -d '' file; do
              sha256sum "$file" > "$file.sha256"
            done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/wsm-graalvm-*.zip
            dist/wsm-graalvm-*.zip.sha256
            dist/wsm-graalvm-*.binary.sha256
            dist/deb/*
            dist/rpm/*
            dist/installer/*
            dist/assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/assets/wsm-graalvm-$VERSION-linux-x86_64"
          test -f "dist/wsm-graalvm-$VERSION-linux-x86_64.zip"
          test -f "dist/assets/wsm-graalvm-$VERSION-windows-x86_64.exe"
          test -f "dist/wsm-graalvm-$VERSION-windows-x86_64.zip"
          test -f "dist/wsm-graalvm-$VERSION-linux-x86_64.zip.sha256"
          test -f "dist/deb/wsm-graalvm-$VERSION-linux-x86_64.deb"
          test -f "dist/rpm/wsm-graalvm-$VERSION-linux-x86_64.rpm"
          test -f "dist/installer/wsm-graalvm-$VERSION-windows-x86_64-installer.exe"
          test -f "dist/deb/wsm-graalvm-$VERSION-linux-x86_64.deb.sha256"
          test -f "dist/rpm/wsm-graalvm-$VERSION-linux-x86_64.rpm.sha256"
          test -f "dist/installer/wsm-graalvm-$VERSION-windows-x86_64-installer.exe.sha256"
          test -f "dist/wsm-graalvm-$VERSION-windows-x86_64.zip.sha256"
          (cd dist && sha256sum -c "wsm-graalvm-$VERSION-linux-x86_64.zip.sha256")
          (cd dist && sha256sum -c "wsm-graalvm-$VERSION-windows-x86_64.zip.sha256")
          (cd dist/assets && sha256sum -c "../wsm-graalvm-$VERSION-linux-x86_64.binary.sha256")
          (cd dist/assets && sha256sum -c "../wsm-graalvm-$VERSION-windows-x86_64.binary.sha256")
          LINUX_PIN=$(unzip -p "dist/wsm-graalvm-$VERSION-linux-x86_64.zip" MY_LISP_PIN.txt)
          WINDOWS_PIN=$(unzip -p "dist/wsm-graalvm-$VERSION-windows-x86_64.zip" MY_LISP_PIN.txt)
          test -n "$LINUX_PIN"
          test "$LINUX_PIN" = "$WINDOWS_PIN"
      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "tag appeared before publish; refusing partial release" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
# wsm-graalvm $TAG

Source commit: $SOURCE_SHA

Native Image artifacts: Linux x86_64 and Windows x86_64.

Each archive contains the exact pinned my-lisp authority slice, README, LICENSE, launcher, release metadata, and SHA256 checksums.
EOF
          ASSETS=(
            "dist/assets/wsm-graalvm-$VERSION-linux-x86_64"
            "dist/wsm-graalvm-$VERSION-linux-x86_64.zip"
            "dist/wsm-graalvm-$VERSION-linux-x86_64.zip.sha256"
            "dist/wsm-graalvm-$VERSION-linux-x86_64.binary.sha256"
            "dist/deb/wsm-graalvm-$VERSION-linux-x86_64.deb"
            "dist/rpm/wsm-graalvm-$VERSION-linux-x86_64.rpm"
            "dist/assets/wsm-graalvm-$VERSION-windows-x86_64.exe"
            "dist/installer/wsm-graalvm-$VERSION-windows-x86_64-installer.exe"
            "dist/wsm-graalvm-$VERSION-windows-x86_64.zip"
            "dist/wsm-graalvm-$VERSION-windows-x86_64.zip.sha256"
            "dist/wsm-graalvm-$VERSION-windows-x86_64.binary.sha256"
          )
          gh release create "$TAG" --target "$SOURCE_SHA" --title "wsm-graalvm $TAG" --notes-file release-notes.md "${ASSETS[@]}"