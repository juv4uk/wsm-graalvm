name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  GRAALVM_VERSION: "25.3.4.1"
  SENS_CHECKOUT_TOKEN: ${{ secrets.SENS_READ_TOKEN || github.token }}

jobs:
  test:
    name: focused release smoke before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ env.SENS_CHECKOUT_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: ${{ env.GRAALVM_VERSION }}
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release tag and authority pin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="${GITHUB_REF_NAME}"
          test "$TAG" = "v$VERSION" || {
            echo "tag/package version mismatch: tag=$TAG VERSION=$VERSION" >&2
            exit 1
          }
          PIN="$(git ls-tree HEAD external/sens | awk '{print $3}')"
          test -n "$PIN"
          test -d external/sens
          test "$(git -C external/sens rev-parse HEAD)" = "$PIN"
          bash scripts/verify-authority.sh external/sens
          echo "RELEASE INPUTS tag=$TAG version=$VERSION wsm=$(git rev-parse HEAD) sens=$PIN"

      - name: Verify release toolchain and packaging scripts
        shell: bash
        run: |
          set -euo pipefail
          java --version
          javac --version
          native-image --version
          bash -n \
            scripts/build.sh \
            scripts/build-native.sh \
            scripts/stage-release-payload.sh \
            scripts/write-release-metadata.sh \
            scripts/package-deb.sh \
            scripts/package-rpm.sh \
            scripts/test-linux-packages.sh \
            scripts/release-gate.sh \
            scripts/test-release-artifact-contract.sh
          python3 -m py_compile scripts/write-release-sbom.py
          bash scripts/test-release-artifact-contract.sh

      - name: Run semantic release gate
        shell: bash
        run: bash scripts/release-gate.sh

  create-release:
    name: Create the GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Створюємо Release один раз ДО паралельного завантаження assets.
      # Це та сама модель, що використовується в батьківському SENS:
      # build jobs більше не змагаються між собою за створення одного release.
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: WSM/GraalVM · Linux x86_64
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ env.SENS_CHECKOUT_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: ${{ env.GRAALVM_VERSION }}
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify authority and toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-authority.sh external/sens
          java --version
          javac --version
          native-image --version

      - name: Build native Linux payload
        shell: bash
        env:
          MYLISP: external/sens
        run: |
          set -euo pipefail
          bash scripts/build-native.sh
          test -x native-wsm
          rm -rf dist
          bash scripts/stage-release-payload.sh "v${GITHUB_REF_NAME#v}" linux-x86_64 native-wsm dist/linux-x86_64

      - name: Build DEB and RPM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          bash scripts/package-deb.sh "$GITHUB_REF_NAME" dist/linux-x86_64 dist/deb
          bash scripts/package-rpm.sh "$GITHUB_REF_NAME" dist/linux-x86_64 dist/rpm

      - name: Test package lifecycle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/test-linux-packages.sh "$GITHUB_REF_NAME" dist/linux-x86_64 \
            "dist/deb/wsm-graalvm-$VERSION-linux-x86_64.deb" \
            "dist/rpm/wsm-graalvm-$VERSION-linux-x86_64.rpm"

      - name: Package portable Linux archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist/linux-x86_64
          tar -czf "../wsm-graalvm-$VERSION-linux-x86_64.tar.gz" .

      - name: Hash Linux release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum \
            "wsm-graalvm-$VERSION-linux-x86_64.tar.gz" \
            "deb/wsm-graalvm-$VERSION-linux-x86_64.deb" \
            "rpm/wsm-graalvm-$VERSION-linux-x86_64.rpm" \
            > linux-SHA256SUMS.txt

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/wsm-graalvm-*linux-x86_64.tar.gz
            dist/deb/*.deb
            dist/rpm/*.rpm
            dist/linux-SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: WSM/GraalVM · Windows x86_64 + MSI
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ env.SENS_CHECKOUT_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: ${{ env.GRAALVM_VERSION }}
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify authority and toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-authority.sh external/sens
          java --version
          javac --version
          G_POSIX="$(cygpath -u "$GRAALVM_HOME")"
          "$G_POSIX/bin/native-image.cmd" --version

      - name: Build native Windows payload
        shell: bash
        env:
          MYLISP: external/sens
        run: |
          set -euo pipefail
          bash scripts/build-native.sh
          test -f native-wsm.exe
          rm -rf dist
          bash scripts/stage-release-payload.sh "$GITHUB_REF_NAME" windows-x86_64 native-wsm.exe dist/windows-x86_64

      - name: Build MSI
        shell: pwsh
        run: |
          ./scripts/package-msi.ps1 "$env:GITHUB_REF_NAME" "$env:GITHUB_WORKSPACE\dist\windows-x86_64" "$env:GITHUB_WORKSPACE\dist\msi"

      - name: Test MSI lifecycle
        shell: pwsh
        run: |
          ./scripts/test-msi-lifecycle.ps1 "$env:GITHUB_WORKSPACE\dist\msi\wsm-graalvm-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-x86_64.msi" "$env:GITHUB_WORKSPACE\dist\windows-x86_64"

      - name: Package portable Windows archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "wsm-graalvm-${version}-windows-x86_64"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\windows-x86_64\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\$name.zip" -Force

      - name: Hash Windows release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $files = @(
            "$env:GITHUB_WORKSPACE\dist\wsm-graalvm-${version}-windows-x86_64.zip",
            "$env:GITHUB_WORKSPACE\dist\msi\wsm-graalvm-${version}-windows-x86_64.msi"
          )
          $hashes = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path $f -Leaf)
          }
          Set-Content -Path "$env:GITHUB_WORKSPACE\dist\windows-SHA256SUMS.txt" -Value $hashes

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/wsm-graalvm-*-windows-x86_64.zip
            dist/msi/*.msi
            dist/windows-SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
