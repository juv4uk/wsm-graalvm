name: m0-gates

on:
  push:
    branches: [ main, "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch my-lisp authority pin
        run: |
          git -C external/my-lisp fetch origin --quiet
          SHA=$(git -C external/my-lisp rev-parse HEAD)
          echo "my-lisp pinned at $SHA"

      - name: Verify pinned my-lisp authority
        run: |
          bash scripts/verify-authority.sh external/my-lisp
      - name: Set up GraalVM CE pinned to the runtime the substrate is built for
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (javac, interpreter classes)
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=${G} bash scripts/build.sh

      - name: Gate 5 — (canon-conforms?) → current conformance record
        run: |
          MYLISP=external/my-lisp bash scripts/run-canon.sh 2>&1 | tee gate5.log
          grep -q "(canon-conformance satisfied)" gate5.log

      - name: M1 — shared definition frame across Context.eval
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G bash scripts/test-context.sh external/my-lisp/lib/surface/semantic-registry.lisp

      - name: Gate 6 — Tier-1 conformance against pinned upstream fixture
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G MYLISP=external/my-lisp bash scripts/test-tier1.sh
