name: m0-gates

on:
  push:
    branches: [ main, "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up GraalVM CE 25.3
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce pinned Lisp-only authority checkout
        run: bash scripts/sync-authority.sh

      - name: Bootstrap exact Graal/Truffle API jars
        run: bash scripts/bootstrap-graal-deps.sh

      - name: Build
        run: bash scripts/build.sh

      - name: Gate 5 — real canon-conforms
        run: |
          MYLISP=external/my-lisp bash scripts/run-canon.sh | tee gate5.log
          grep -q "(canon-conformance satisfied)" gate5.log

      - name: Gate 6+ — tier-1 conformance
        if: always()
        run: |
          echo "not yet implemented; see issue #9"
