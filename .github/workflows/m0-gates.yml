name: m0-gates

on:
  push:
    branches: [ main, "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch my-lisp authority pin
        run: |
          git -C external/my-lisp fetch origin --quiet
          SHA=$(git -C external/my-lisp rev-parse HEAD)
          echo "my-lisp pinned at $SHA"

      - name: Verify authority digests (fail-closed, like scripts/sync-authority.sh)
        run: |
          for f in language-contract.lisp my-lisp-constitution.lisp \
                   lib/canon.lisp lib/surface/semantic-registry.lisp \
                   tests/fixtures/conformance.lisp; do
            test -f "external/my-lisp/$f" || { echo "FAIL-CLOSED: missing $f"; exit 1; }
          done
          cat > authority.sha256 <<'EOF'
737cc3373abca40ae511ea0114609fdcb7a172b918e69dced615a458ff5818a9  external/my-lisp/language-contract.lisp
65f0f19cbb7c6a911430754349cc4828c1ce2df9be94a4693c9cece215a12369  external/my-lisp/my-lisp-constitution.lisp
9b7b10861944b9b51d8b1a33aadb8109c7ee384b8e15d84485de71710007a991  external/my-lisp/lib/canon.lisp
f64f5ea7341a5f8d2c873d1f5f2731e7b30befda8b6593a9af3a596942e51d72  external/my-lisp/lib/surface/semantic-registry.lisp
e0b50161d1919f2c26c8c7549b583876acb5cebad437441ed0e1d47514bec3f3  external/my-lisp/tests/fixtures/conformance.lisp
EOF
          sha256sum --check authority.sha256

      - name: Set up GraalVM CE pinned to the runtime the substrate is built for
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (javac, interpreter classes)
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=${G} bash scripts/build.sh

      - name: Gate 5 — (canon-conforms?) → current conformance record
        run: |
          MYLISP=external/my-lisp bash scripts/run-canon.sh 2>&1 | tee gate5.log
          grep -q "(canon-conformance satisfied)" gate5.log

      - name: M1 — shared definition frame across Context.eval
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G bash scripts/test-context.sh external/my-lisp/lib/surface/semantic-registry.lisp

      - name: Gate 6 — Tier-1 conformance against pinned upstream fixture
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G MYLISP=external/my-lisp bash scripts/test-tier1.sh


  native-image-witness:
    name: Native Image — real Canon witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch my-lisp authority pin
        run: |
          git -C external/my-lisp fetch origin --quiet
          SHA=$(git -C external/my-lisp rev-parse HEAD)
          echo "my-lisp pinned at $SHA"

      - name: Set up GraalVM CE + Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run native Canon witness
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G MYLISP=external/my-lisp bash scripts/build-native.sh
