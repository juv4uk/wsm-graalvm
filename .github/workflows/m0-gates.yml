name: m0-gates

on:
  push:
    branches: [ main, "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch my-lisp authority pin
        run: |
          git -C external/my-lisp fetch origin --quiet
          SHA=$(git -C external/my-lisp rev-parse HEAD)
          echo "my-lisp pinned at $SHA"

      - name: Verify authority digests (fail-closed, like scripts/sync-authority.sh)
        run: |
          for f in language-contract.lisp my-lisp-constitution.lisp \
                   lib/canon.lisp lib/surface/semantic-registry.lisp \
                   tests/fixtures/conformance.lisp; do
            test -f "external/my-lisp/$f" || { echo "FAIL-CLOSED: missing $f"; exit 1; }
          done
          sha256sum external/my-lisp/language-contract.lisp \
                    external/my-lisp/my-lisp-constitution.lisp \
                    external/my-lisp/lib/canon.lisp \
                    external/my-lisp/lib/surface/semantic-registry.lisp \
                    external/my-lisp/tests/fixtures/conformance.lisp

      - name: Set up GraalVM CE pinned to the runtime the substrate is built for
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (javac, interpreter classes)
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=${G} bash scripts/build.sh

      - name: RED/green — conformance fixture string reader
        run: bash scripts/test-reader-string.sh

      - name: RED/green — Tier-1 inventory contract
        run: bash scripts/test-conformance-inventory.sh

      - name: RED/green — real pinned Tier-1 inventory
        run: bash scripts/test-real-tier1-inventory.sh

      - name: Gate 4b — focused Truffle frame witnesses
        run: bash scripts/test-truffle-frames.sh

      - name: RED/green — pinned variadic lambda F25/F26/F27
        run: bash scripts/test-variadic-lambda.sh

      - name: RED/green — raw Tier-1 ErrorKind parity
        run: bash scripts/test-tier1-error-parity.sh

      - name: Gate 5 — (canon-conforms?) → current conformance record
        run: |
          MYLISP=external/my-lisp bash scripts/run-canon.sh 2>&1 | tee gate5.log
          grep -q "(canon-conformance satisfied)" gate5.log

      - name: Gate 6+ — tier-1 conformance (next; no silent pass)
        if: always()
        run: |
          echo "not yet implemented; see tasks.lisp GRAALVM-M1-CONFORMANCE-TIER1 (issue #9 gate 6)"
