name: m0-gates

on:
  push:
    branches: [ main, "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wsm-graalvm
    env:
      WSM_LISP_HOME: ${{ github.workspace }}/my-lisp
    steps:
      - name: Checkout wsm-graalvm
        uses: actions/checkout@v4
        with:
          path: wsm-graalvm
          fetch-depth: 0

      - name: Resolve Tier-1 upstream evidence pin
        id: authority
        run: |
          PIN=$(sed -n 's/^MY_LISP_PIN=//p' refs/tier1-baseline.properties)
          test -n "$PIN"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"

      - name: Checkout my-lisp authority beside wsm-graalvm
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          ref: ${{ steps.authority.outputs.pin }}
          path: my-lisp
          fetch-depth: 1

      - name: Verify sibling my-lisp authority
        run: |
          bash scripts/verify-authority.sh
          test "$(readlink lib)" = "../my-lisp/lib"
          test "$(readlink tests)" = "../my-lisp/tests"

      - name: Set up GraalVM CE pinned to the runtime the substrate is built for
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (javac, interpreter classes)
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=${G} bash scripts/build.sh

      - name: RED/green — conformance fixture string reader
        run: bash scripts/test-reader-string.sh

      - name: RED/green — Tier-1 inventory contract
        run: bash scripts/test-conformance-inventory.sh

      - name: RED/green — real upstream Tier-1 inventory
        run: bash scripts/test-real-tier1-inventory.sh

      - name: Gate 4b — focused Truffle frame witnesses
        run: bash scripts/test-truffle-frames.sh

      - name: M1 — sequential Lisp macro/bootstrap
        run: bash scripts/test-sequential-bootstrap.sh

      - name: M1 — Lisp dependency closure
        run: bash scripts/check-lisp-dependency-manifest.sh

      - name: RED/green — variadic lambda F25/F26/F27
        run: bash scripts/test-variadic-lambda.sh

      - name: RED/green — raw Tier-1 ErrorKind parity
        run: bash scripts/test-tier1-error-parity.sh

      - name: Gate 5 — (canon-conforms?) → current conformance record
        run: |
          bash scripts/run-canon.sh 2>&1 | tee gate5.log
          grep -q "(canon-conformance satisfied)" gate5.log

      - name: M1 — monotonic Tier-1 progress ledger
        run: bash scripts/test-tier1-progress.sh

      - name: RED/green contract tests (chatgpt/* migration)
        run: |
          AUTH=$(bash scripts/resolve-my-lisp.sh)
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          TEST_CLASSES="test-classes-contract-gates"
          rm -rf "$TEST_CLASSES"
          mkdir -p "$TEST_CLASSES"
          CP="classes:third_party/truffle-api.jar:third_party/graalvm-collections.jar:third_party/nativeimage.jar:third_party/polyglot.jar:third_party/truffle-runtime.jar:third_party/truffle-compiler.jar"
          G="$G" "$G/bin/javac" --release 25 -cp "$CP" -d "$TEST_CLASSES" \
            src/test/java/wsm/graalvm/ReaderStringContract.java \
            src/test/java/wsm/graalvm/ConformanceInventoryContract.java \
            src/test/java/wsm/graalvm/RealTier1InventoryContract.java \
            src/test/java/wsm/graalvm/TruffleFrameContract.java
          java -cp "$TEST_CLASSES:$CP" wsm.graalvm.ReaderStringContract
          java -cp "$TEST_CLASSES:$CP" wsm.graalvm.ConformanceInventoryContract
          java -cp "$TEST_CLASSES:$CP" wsm.graalvm.RealTier1InventoryContract "$AUTH/tests/fixtures/conformance.lisp"
          java -cp "$TEST_CLASSES:$CP" wsm.graalvm.TruffleFrameContract "$AUTH/lib/surface/semantic-registry.lisp"

      - name: Gate 6 evidence — full Tier-1 shared-session run
        continue-on-error: true
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G bash scripts/test-tier1.sh

      - name: Gate 6 evidence status
        if: always()
        run: |
          echo "Full Tier-1 remains visible evidence while incremental M1 gaps remain."
          echo "Merge blocking is the monotonic ledger plus focused semantic gates."

      - name: M1 — shared definition frame across Context.eval
        run: |
          AUTH=$(bash scripts/resolve-my-lisp.sh)
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G bash scripts/test-context.sh "$AUTH/lib/surface/semantic-registry.lisp"
