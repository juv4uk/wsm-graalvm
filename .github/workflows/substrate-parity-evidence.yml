name: substrate-parity-evidence

on:
  pull_request:
    paths:
      - 'refs/substrate-parity-evidence.json'
      - 'scripts/check-substrate-parity-evidence.py'
      - 'scripts/test-substrate-parity-evidence-validator.py'
      - 'scripts/run-substrate-parity-smoke.sh'
      - '.github/workflows/substrate-parity-evidence.yml'
  push:
    branches:
      - main
    paths:
      - 'refs/substrate-parity-evidence.json'
      - 'scripts/check-substrate-parity-evidence.py'
      - 'scripts/test-substrate-parity-evidence-validator.py'
      - 'scripts/run-substrate-parity-smoke.sh'
      - '.github/workflows/substrate-parity-evidence.yml'

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate parity evidence schema
        run: python3 scripts/check-substrate-parity-evidence.py refs/substrate-parity-evidence.json

      - name: Prove fail-closed RED/GREEN boundaries
        run: python3 scripts/test-substrate-parity-evidence-validator.py

      - name: Set up GraalVM for live parity witness
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize pinned my-lisp authority
        run: |
          git submodule update --init --recursive
          bash scripts/sync-authority.sh

      - name: Run first live Rust/Graal parity witness
        env:
          WSM_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/run-substrate-parity-smoke.sh build/substrate-parity-smoke.json
