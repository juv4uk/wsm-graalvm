name: substrate-parity-evidence

on:
  pull_request:
    paths:
      - 'refs/substrate-parity-evidence.json'
      - 'scripts/check-substrate-parity-evidence.py'
      - 'scripts/test-substrate-parity-evidence-validator.py'
      - '.github/workflows/substrate-parity-evidence.yml'
  push:
    branches:
      - main
    paths:
      - 'refs/substrate-parity-evidence.json'
      - 'scripts/check-substrate-parity-evidence.py'
      - 'scripts/test-substrate-parity-evidence-validator.py'
      - '.github/workflows/substrate-parity-evidence.yml'

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate parity evidence schema
        run: python3 scripts/check-substrate-parity-evidence.py refs/substrate-parity-evidence.json

      - name: Prove fail-closed RED/GREEN boundaries
        run: python3 scripts/test-substrate-parity-evidence-validator.py
