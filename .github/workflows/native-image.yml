name: native-image-witness

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-image:
    name: Native Image — real Canon witness
    runs-on: [self-hosted, guix]
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SENS_READ_TOKEN || github.token }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Fetch my-lisp authority pin
        run: |
          git -C external/sens fetch origin --quiet
          SHA=$(git -C external/sens rev-parse HEAD)
          echo "my-lisp pinned at $SHA"

      - name: Set up GraalVM CE + Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run native Canon witness
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G MYLISP=external/sens bash scripts/build-native.sh

      - name: Record exact-pair Native Image evidence
        env:
          WSM_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          HEAD="$WSM_EVIDENCE_COMMIT"
          PIN=$(git ls-files -s external/sens | awk '$1 == "160000" {print $2}')
          JAVA_VERSION=$("$G/bin/java" --version 2>&1 | head -n 1)
          NATIVE_VERSION=$("$G/bin/native-image" --version 2>&1 | head -n 1)
          python3 scripts/write-native-image-evidence.py             --wsm-head "$HEAD"             --my-lisp-pin "$PIN"             --java-version "$JAVA_VERSION"             --native-image-version "$NATIVE_VERSION"             --out build/native-image-evidence.json
          EVIDENCE_ROOT=build           EVIDENCE_FILES="native-image-evidence.json"           WSM_EVIDENCE_COMMIT="$HEAD"             bash scripts/check-evidence-freshness.sh

      - name: Upload Native Image provenance
        uses: actions/upload-artifact@v4
        with:
          name: native-image-evidence
          path: build/native-image-evidence.json
