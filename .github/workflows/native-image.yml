name: native-image-witness

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-image:
    name: Native Image — real Canon witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch my-lisp authority pin
        run: |
          git -C external/my-lisp fetch origin --quiet
          SHA=$(git -C external/my-lisp rev-parse HEAD)
          echo "my-lisp pinned at $SHA"

      - name: Set up GraalVM CE + Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run native Canon witness
        env:
          WSM_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          G=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          G=$G MYLISP=external/my-lisp WSM_EVIDENCE_COMMIT="$WSM_EVIDENCE_COMMIT" bash scripts/build-native.sh

      - name: Freshness check — Native Image evidence
        env:
          WSM_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_FILES: native-image-evidence.json
        run: bash scripts/check-evidence-freshness.sh

      - name: Upload Native Image evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-image-evidence
          path: build/native-image-evidence.json
