name: native-image-witness

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-image:
    name: Native Image — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch my-lisp authority pin
        shell: bash
        run: |
          git -C external/my-lisp fetch origin --quiet
          SHA=$(git -C external/my-lisp rev-parse HEAD)
          echo "my-lisp pinned at $SHA"

      - name: Set up GraalVM CE + Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3.4.1'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run native Canon witness
        shell: bash
        env:
          MYLISP: external/my-lisp
        run: bash scripts/build-native.sh
