name: quote-contract

on:
  push:
    paths:
      - "src/main/java/wsm/graalvm/Reader.java"
      - "src/main/java/wsm/graalvm/ReaderDatum.java"
      - "src/main/java/wsm/graalvm/Compiler.java"
      - "src/main/java/wsm/graalvm/CanonRegistry.java"
      - "src/main/java/wsm/graalvm/Printer.java"
      - "src/test/java/wsm/graalvm/QuoteContract.java"
      - "scripts/test-quote-contract.sh"
      - "scripts/resolve-my-lisp.sh"
      - ".github/workflows/quote-contract.yml"
  pull_request:
    paths:
      - "src/main/java/wsm/graalvm/Reader.java"
      - "src/main/java/wsm/graalvm/ReaderDatum.java"
      - "src/main/java/wsm/graalvm/Compiler.java"
      - "src/main/java/wsm/graalvm/CanonRegistry.java"
      - "src/main/java/wsm/graalvm/Printer.java"
      - "src/test/java/wsm/graalvm/QuoteContract.java"
      - "scripts/test-quote-contract.sh"
      - "scripts/resolve-my-lisp.sh"
      - ".github/workflows/quote-contract.yml"

jobs:
  quote:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wsm-graalvm
    env:
      WSM_LISP_HOME: ${{ github.workspace }}/my-lisp
    steps:
      - name: Checkout wsm-graalvm
        uses: actions/checkout@v4
        with:
          path: wsm-graalvm
          fetch-depth: 0
      - name: Resolve Tier-1 upstream evidence pin
        id: authority
        run: |
          PIN=$(sed -n 's/^MY_LISP_PIN=//p' refs/tier1-baseline.properties)
          test -n "$PIN"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
      - name: Checkout my-lisp authority beside wsm-graalvm
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          ref: ${{ steps.authority.outputs.pin }}
          path: my-lisp
          fetch-depth: 1
      - name: Verify sibling my-lisp authority
        run: bash scripts/verify-authority.sh
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          version: "25.3.4.1"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Quote / apostrophe / dotted-data contract
        run: bash scripts/test-quote-contract.sh
